<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Chart — Saju × Zodiac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b09;
    --panel: #141613;
    --panel-2: #1a1d18;
    --edge: rgba(255,255,255,0.07);
    --ink: #f4f6f0;
    --ink-dim: #9aa093;
    --ink-faint: #6b7065;
    --lime: #d7fb3f;
    --lime-soft: rgba(215,251,63,0.14);
    --lime-glow: rgba(215,251,63,0.45);
    --sheet-ink: #14160f;
    --sheet-dim: #8d9184;
    --wood: #7ed49a;
    --fire: #ff8a70;
    --earth: #e0b56e;
    --metal: #ccd2dc;
    --water: #7cb5f2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- map-grid backdrop ---------- */
  .gridmap {
    position: fixed; inset: -30%; z-index: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg,  rgba(255,255,255,0.05) 0 1px, transparent 1px 84px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 62px),
      repeating-linear-gradient(0deg,  rgba(255,255,255,0.025) 0 1px, transparent 1px 21px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 16px);
    transform: rotate(-16deg) scale(1.15);
  }
  .gridmap::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, transparent 30%, rgba(10,11,9,0.85) 100%),
      linear-gradient(180deg, rgba(10,11,9,0.55), transparent 30%, transparent 65%, rgba(10,11,9,0.8));
  }
  /* glowing route line drawn on the backdrop */
  .route {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .8;
  }
  .route polyline {
    fill: none; stroke: var(--lime); stroke-width: 3.5;
    stroke-linejoin: round; stroke-linecap: round;
    filter: drop-shadow(0 0 6px var(--lime-glow)) drop-shadow(0 0 18px rgba(215,251,63,0.25));
    stroke-dasharray: 1600; stroke-dashoffset: 1600;
    animation: draw 2.4s ease forwards .3s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .route circle.node { fill: #fff; }
  .route circle.halo { fill: none; stroke: var(--lime); stroke-width: 3; opacity: .8;
    filter: drop-shadow(0 0 8px var(--lime-glow)); }

  .wrap {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto; padding: 44px 20px 72px;
  }

  /* ---------- header ---------- */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 34px; }
  h1 { font-size: clamp(30px, 6vw, 40px); font-weight: 800; letter-spacing: -0.03em; }
  .topbar .sub { margin-top: 6px; color: var(--ink-dim); font-size: 15px; font-weight: 500; }
  .dots {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,0.07); border: 1px solid var(--edge);
    display: grid; place-items: center; color: var(--ink); font-weight: 800; letter-spacing: 1px;
    font-size: 15px; user-select: none;
  }

  /* ---------- panels ---------- */
  .panel {
    background: linear-gradient(170deg, var(--panel-2), var(--panel));
    border: 1px solid var(--edge);
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
  }
  .panel + .panel, #result .panel { margin-top: 16px; }

  .field { margin-bottom: 20px; }
  label.lbl {
    display: block; font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 8px;
  }
  input[type="text"], input[type="date"], input[type="time"] {
    width: 100%; padding: 14px 15px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
    outline: none; transition: border-color .2s, box-shadow .2s;
    color-scheme: dark;
  }
  input:focus { border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-soft); }
  input:disabled { opacity: .4; }
  .check-row {
    display: flex; align-items: center; gap: 9px; margin-top: 10px;
    color: var(--ink-dim); font-size: 13.5px; font-weight: 500; user-select: none; cursor: pointer;
  }
  .check-row input { accent-color: var(--lime); width: 16px; height: 16px; cursor: pointer; }

  .btn {
    width: 100%; padding: 17px;
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
    color: #171a06;
    background: var(--lime);
    border: none; border-radius: 16px; cursor: pointer;
    transition: transform .15s, box-shadow .15s, filter .15s;
    box-shadow: 0 0 0 1px rgba(215,251,63,0.4), 0 10px 32px rgba(215,251,63,0.28);
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn:active { transform: translateY(0); }
  .err { color: var(--fire); font-size: 14px; margin-top: 10px; display: none; font-weight: 500; }

  /* ---------- result ---------- */
  #result { display: none; }
  .fade-in { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* hero */
  .hero-res { text-align: center; padding: 34px 20px 10px; }
  .hero-res .glyphs {
    font-size: 38px; font-weight: 700; color: var(--lime);
    text-shadow: 0 0 18px var(--lime-glow), 0 0 40px rgba(215,251,63,0.25);
    margin-bottom: 14px;
  }
  .eyebrow {
    font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--lime); font-weight: 700; margin-bottom: 10px;
  }
  .hero-res h2 { font-size: clamp(28px, 5.6vw, 38px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }

  /* white sheet card (reference style) */
  .sheet {
    background: #fff; color: var(--sheet-ink);
    border-radius: 26px; padding: 20px;
    margin-top: 22px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
  }
  .sheet-top { display: flex; align-items: center; gap: 16px; }
  .thumb {
    width: 74px; height: 74px; flex: none; border-radius: 18px;
    background: #14160f;
    display: grid; place-items: center;
    color: var(--lime); font-size: 24px; font-weight: 700; line-height: 1.15; text-align: center;
    text-shadow: 0 0 10px var(--lime-glow);
  }
  .sheet-title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .sheet-sub { margin-top: 3px; color: var(--sheet-dim); font-size: 13.5px; font-weight: 500; }
  .mode-badge {
    margin-left: auto; width: 52px; height: 52px; flex: none; border-radius: 50%;
    background: #eef4d8; display: grid; place-items: center; font-size: 22px;
  }
  .stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    margin-top: 18px; padding-top: 4px;
  }
  .stats > div { padding: 4px 14px; border-left: 1px solid #e6e8df; }
  .stats > div:first-child { border-left: none; padding-left: 2px; }
  .stats label { display: block; color: var(--sheet-dim); font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .stats b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }

  /* sections */
  .section h3 {
    font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .section h3 .han { color: var(--lime); font-weight: 600; font-size: 17px; }
  .tagline {
    color: var(--ink-faint); font-size: 11.5px; letter-spacing: .14em;
    text-transform: uppercase; font-weight: 700; margin: 7px 0 14px;
  }
  p.body { color: #c9cec0; line-height: 1.75; font-size: 15px; }
  p.body + p.body { margin-top: 12px; }
  p.body b { color: var(--ink); }

  /* pillars */
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 4px; }
  .pillar {
    text-align: center; padding: 15px 5px 13px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--edge);
    border-radius: 16px;
  }
  .pillar.me { border-color: rgba(215,251,63,0.45); background: var(--lime-soft); }
  .pillar .p-title { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 9px; font-weight: 700; }
  .pillar.me .p-title { color: var(--lime); }
  .pillar .hanja { font-size: 28px; line-height: 1.25; font-weight: 500; }
  .pillar .p-en { font-size: 11px; color: var(--ink-dim); margin-top: 7px; line-height: 1.45; font-weight: 500; }
  .pillar.unknown .hanja { color: var(--ink-faint); font-size: 20px; padding: 7px 0; }

  /* element pills */
  .el-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .el-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--edge);
    font-size: 13.5px; font-weight: 700;
  }
  .el-pill .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .el-pill .cnt { color: var(--ink-dim); font-weight: 500; }
  .el-note { margin-top: 14px; color: #c9cec0; font-size: 14px; line-height: 1.7; }
  .el-note b { color: var(--ink); }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 14px; }
  .chip {
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    background: var(--lime-soft); border: 1px solid rgba(215,251,63,0.35);
    color: var(--lime);
  }

  /* lucky grid */
  .lucky { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 18px; }
  .lucky-item {
    padding: 15px 12px; text-align: center;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--edge); border-radius: 16px;
  }
  .lucky-item .l-label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; margin-bottom: 7px; }
  .lucky-item .l-val { font-size: 15px; font-weight: 700; }

  .again {
    display: block; width: 100%; margin-top: 16px; padding: 16px;
    background: rgba(255,255,255,0.05); color: var(--ink-dim);
    border: 1px solid var(--edge); border-radius: 16px;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .again:hover { color: var(--lime); border-color: rgba(215,251,63,0.4); }

  .disclaimer { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 26px; line-height: 1.6; font-weight: 500; }

  @media (max-width: 560px) {
    .pillars { grid-template-columns: repeat(2, 1fr); }
    .stats b { font-size: 15px; }
  }
</style>
</head>

/* ================================================================
   SAJU ENGINE
   ================================================================ */
function julianDayNumber(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
         Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}

/* Solar month index 0..11 = 寅..丑, using approximate solar-term dates */
function solarMonthIndex(m, d) {
  if (m === 1) return d >= 6 ? 11 : 10;
  const bounds = [[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7]];
  let idx = 11; // Feb 1–3 → still 丑 month
  for (let i = 0; i < bounds.length; i++) {
    const [bm, bd] = bounds[i];
    if (m > bm || (m === bm && d >= bd)) idx = i;
  }
  return idx;
}

function computeSaju(y, m, d, hour) {
  // Year pillar (solar year starts at Li Chun ≈ Feb 4)
  let solarYear = y;
  if (m === 1 || (m === 2 && d < 4)) solarYear = y - 1;
  const yStem = ((solarYear - 4) % 10 + 10) % 10;
  const yBranch = ((solarYear - 4) % 12 + 12) % 12;

  // Month pillar
  const mIdx = solarMonthIndex(m, d);
  const mBranch = (mIdx + 2) % 12;
  const mStem = ((yStem % 5) * 2 + 2 + mIdx) % 10;

  // Day pillar (sexagenary, 甲子 = 0)
  const jdn = julianDayNumber(y, m, d);
  const dayIdx = ((jdn + 49) % 60 + 60) % 60;
  const dStem = dayIdx % 10;
  const dBranch = dayIdx % 12;

  // Hour pillar
  let hStem = null, hBranch = null;
  if (hour !== null) {
    hBranch = Math.floor(((hour + 1) % 24) / 2);
    hStem = ((dStem % 5) * 2 + hBranch) % 10;
  }

  return { yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch };
}

function westernZodiac(m, d) {
  const cutoffs = [
    [1,20],[2,19],[3,21],[4,20],[5,21],[6,22],
    [7,23],[8,23],[9,23],[10,24],[11,22],[12,22],
  ];
  const [, cd] = cutoffs[m - 1];
  const idx = (d >= cd) ? m : m - 1;
  return ZODIACS[idx % 12];
}

const $ = (id) => document.getElementById(id);

function pillarCard(title, stemIdx, branchIdx, me) {
  if (stemIdx === null) {
    return `<div class="pillar unknown">
      <div class="p-title">${title}</div>
      <div class="hanja">?<br>?</div>
      <div class="p-en">Unknown<br>(no birth time)</div>
    </div>`;
  }
  const s = STEMS[stemIdx], b = BRANCHES[branchIdx];
  return `<div class="pillar${me ? ' me' : ''}">
    <div class="p-title">${title}</div>
    <div class="hanja">${s.han}<br>${b.han}</div>
    <div class="p-en">${s.en}<br>over ${b.en}</div>
  </div>`;
}

function countElements(saju) {
  const counts = { Wood:0, Fire:0, Earth:0, Metal:0, Water:0 };
  const add = (el) => counts[el]++;
  add(STEMS[saju.yStem].el);  add(BRANCHES[saju.yBranch].el);
  add(STEMS[saju.mStem].el);  add(BRANCHES[saju.mBranch].el);
  add(STEMS[saju.dStem].el);  add(BRANCHES[saju.dBranch].el);
  if (saju.hStem !== null) { add(STEMS[saju.hStem].el); add(BRANCHES[saju.hBranch].el); }
  return counts;
}

      <div class="pillars">
        ${pillarCard('Hour · You', saju.hStem, saju.hBranch)}

        ${pillarCard('Month · Career', saju.mStem, saju.mBranch)}

function resetForm() {
  $('result').style.display = 'none';
  $('formCard').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
